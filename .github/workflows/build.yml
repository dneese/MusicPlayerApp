name: Build, Test and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  widget-test:
    name: Widget tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧪 Run widget tests
        run: flutter test test/widget_test.dart

  integration-test:
    name: Integration tests (Android emulator)
    runs-on: macos-latest
    # Android emulator cannot boot on GitHub-hosted arm64 runners (HVF unsupported).
    # Run it as best-effort so it does not block releases.
    continue-on-error: true
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Generate Android structure (clean)
        run: |
          rm -rf android
          flutter create --platforms=android . --project-name music_player_app

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🚀 Boot emulator and run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: arm64-v8a
          target: default
          disable-animations: true
          script: flutter test integration_test/app_test.dart

  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Generate Android structure (clean)
        run: |
          rm -rf android
          flutter create --platforms=android . --project-name music_player_app

      - name: Add Android permissions & config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\
          \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
          \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
          \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
          \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

      - name: 📦 Install dependencies
        run: |
          flutter pub get
          flutter pub upgrade

      - name: 🏗️ Build APK
        run: |
          flutter build apk --release --split-per-abi --verbose

      - name: 📦 Build App Bundle
        run: flutter build appbundle --release

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          retention-days: 30

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Music Player ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
