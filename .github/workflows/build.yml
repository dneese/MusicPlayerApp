name: Build, Test and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: 💾 Cache Gradle (speeds up Android builds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android structure (clean)
        run: |
          rm -rf android
          flutter create --platforms=android . --project-name music_player_app

      - name: Add Android permissions & config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\
          \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
          \    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
          \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
          \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\
          \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' "$MANIFEST"

          # Reconcile a single Kotlin stdlib version to avoid duplicate-class
          # failures when share_plus pulls in a newer kotlin-stdlib.
          ROOT_GRADLE="android/build.gradle"
          printf '\nsubprojects {\n    configurations.all {\n        resolutionStrategy.eachDependency { details ->\n            if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {\n                details.useVersion "1.8.10"\n            }\n        }\n    }\n}\n' >> "$ROOT_GRADLE"

      - name: 📦 Install dependencies
        run: |
          flutter pub get
          flutter pub upgrade

      - name: 🏗️ Build APK
        run: |
          flutter build apk --release --split-per-abi --verbose

      - name: 📦 Build App Bundle
        run: flutter build appbundle --release

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          retention-days: 30

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Music Player ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
