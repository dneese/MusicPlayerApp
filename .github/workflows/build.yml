name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true
      
      - name: 🔧 Universal Flutter repair
        run: |
          echo "🔧 Running universal repair..."
          
          # 1. Исправляем gradlew
          if [ -f android/gradlew ]; then
            if ! file android/gradlew | grep -q "script"; then
              echo "❌ gradlew поврежден, восстанавливаем..."
              rm -f android/gradlew
            fi
          fi
          if [ ! -f android/gradlew ]; then
            curl -o android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew
            chmod +x android/gradlew
            sed -i 's/\r$//' android/gradlew
          fi
          
          # 2. Исправляем gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
          EOF
          
          # 3. Исправляем AndroidX
          mkdir -p android
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # 4. Чистим кэш
          flutter clean || true
          flutter pub get || true
          
          echo "✅ Universal repair complete!"
      
      - name: 🏗️ Build APK
        run: |
          flutter build apk --release --split-per-abi --verbose
      
      - name: 📦 Build App Bundle
        run: flutter build appbundle --release
      
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          retention-days: 30
      
      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Music Player ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
